<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#b5566e" />
    <title>Bean Culture · Order ahead</title>
    <!-- Warm up the connections we always need: Square payments SDK/API + the
         Cloudinary image CDN — so payment buttons and banners appear faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://web.squarecdn.com" />
    <link rel="preconnect" href="https://pci-connect.squareup.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://web.squarecdn.com" />
    <!-- ?v= cache-busts the icon files themselves (same filenames, new bytes
         on a re-brand) -- browsers/OSes cache favicons/app-icons aggressively
         (often well past the 1-day HTTP header below, especially an installed
         desktop app's extracted icon), so bump this token whenever the icon
         PNGs are replaced in place. manifest.webmanifest is no-cache, so this
         change takes effect immediately for anyone whose browser re-checks it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-32.png?v=20260820" sizes="32x32" />
    <link rel="icon" href="/icons/icon-16.png?v=20260820" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png?v=20260820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bean Culture" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Pre-paint theme seed: if the customer saved a storefront theme, write its
         --t-* tokens onto :root BEFORE the app boots. Because .store-shell reads
         var(--t-*, <espresso-fallback>), this re-skins instantly with no flash of
         the default look. Nothing saved → the Espresso Plum fallbacks render. -->
    <script>
      try {
        var b = JSON.parse(localStorage.getItem('bean-culture-theme'));
        if (b && b.tokens) { var r = document.documentElement; for (var k in b.tokens) { r.style.setProperty(k, b.tokens[k]); } }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
